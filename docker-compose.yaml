version: "3.8"

services:
  db:
    image: postgres:18.6-alpine
    container_name: dz_province_db
    environment:
      POSTGRES_USER: dz_province_user
      POSTGRES_PASSWORD: dz_province_password
      POSTGRES_DB: dz_province_dev
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  db_data:
