[versions]
graalvm = "1.1.13"
kotlin = "2.3.21"
ktlint = "1.8.0"
prettier = "3.9.8"
spotless = "8.10.2"
springBoot = "4.1.1"
springDependencyManagement = "1.1.7"

[libraries]
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
flyway-postgresql = { group = "org.flywaydb", name = "flyway-database-postgresql" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect"}
kotlin-test-junit5= { group = "org.jetbrains.kotlin", name = "kotlin-test-junit5" }
postgresql = { group = "org.postgresql", name = "postgresql" }
spring-boot-starter-data-jdbc = { group = "org.springframework.boot", name = "spring-boot-starter-data-jdbc" }
spring-boot-starter-data-jdbc-test = { group = "org.springframework.boot", name = "spring-boot-starter-data-jdbc-test" }
spring-boot-starter-flyway = { group = "org.springframework.boot", name = "spring-boot-starter-flyway" }
spring-boot-starter-flyway-test = { group = "org.springframework.boot", name = "spring-boot-starter-flyway-test" }
spring-boot-starter-kotlinx-serialization-json = { group = "org.springframework.boot", name = "spring-boot-starter-kotlinx-serialization-json" }
spring-boot-starter-kotlinx-serialization-json-test = { group = "org.springframework.boot", name = "spring-boot-starter-kotlinx-serialization-json-test" }
spring-boot-starter-webmvc = { group = "org.springframework.boot", name = "spring-boot-starter-webmvc" }
spring-boot-starter-webmvc-test = { group = "org.springframework.boot", name = "spring-boot-starter-webmvc-test" }
spring-boot-docker-compose = { group = "org.springframework.boot", name = "spring-boot-docker-compose" }
spring-boot-testcontainers= { group = "org.springframework.boot", name = "spring-boot-testcontainers" }
testcontainers-junit-jupiter = { group = "org.testcontainers", name = "testcontainers-junit-jupiter" }
testcontainers-postgresql = { group = "org.testcontainers", name = "testcontainers-postgresql" }

[plugins]
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvm"}
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependencyManagement = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
