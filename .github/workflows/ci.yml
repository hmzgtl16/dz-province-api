name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up JDK 17
      uses: actions/setup-java@v6.0.1
      with:
        java-version: '17'
        distribution: 'liberica-nik'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.3.0

    - name: Build with Gradle Wrapper
      run: ./gradlew build

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up JDK 17
      uses: actions/setup-java@v6.0.1
      with:
        java-version: '17'
        distribution: 'liberica-nik'

    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v6.3.0
